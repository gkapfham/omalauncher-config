# The launcher's style. The Style menu writes it too; settings left out have
# their default, and defaults.toml next to this file lists them all.
# Changes show on the phone within a second; errors.txt says what was ignored.

version = 1
theme = "vitamin"
background = "image-1793586720734.png"
font = "Maple Mono NF"

[home]
columns = 9
single-page = true

[widgets]
opacity = 0.93
border-width = 0

[icons]
monochrome = true

[corners]
scale = 1

[status-bar]
shown = false

[terminal]
font = "Maple Mono NF:style=SemiBold"

[gestures]
swipe-up = "drawer.owl"
swipe-down = "controls.owl"
