# Every setting style.toml takes, at its default. Copy what you want to change into
# style.toml next to this file. The launcher rewrites this file on updates.

version = 1

# The Omarchy theme, by its directory name in ~/.local/share/omarchy/themes or ~/.config/omarchy/themes (yours win).
# theme = "…"

# A file name from the theme's backgrounds/ or ~/.config/omarchy/backgrounds/<theme>/. Unset: the theme's first.
# background = "…"

# The font family of the launcher's text and widgets: "system" is Android's monospace; fc-list :spacing=100 lists those Linux has.
font = "system"

[home]
# Apps on home in a tile like a widget; false draws bare icons on the wallpaper.
app-tiles = true

# The strip of recently used apps above the prompt bar.
recent-apps = true

# The empty page left of home's leftmost, inviting a new face; false ends home at its own first page.
empty-page-left = true

# The empty page after home's last, for new tiles; false shows it only while a tile is carried, to drop it on.
empty-page-right = true

# Columns of home's grid. Fewer make bigger cells, and apps show their names under their icons once a cell is tall enough.
columns = 6

# One page even on a screen shaped like an unfolded foldable's; false shows two there, auto-detected from the screen's shape and width.
single-page = false

[widgets]
# Space in dp between two of home's widgets (all of it, unlike Hyprland's gaps_in, which each window has on its side).
gaps-in = 6

# Space in dp from home's widgets, the strip and the prompt bar to the screen's edges.
gaps-out = 6

# How much widgets, terminal widgets among them, the prompt bar and the rails cover the wallpaper: 0 clear, 1 solid. The system bars' bands have their own.
opacity = 0.88

# The wallpaper behind widgets, the prompt bar and the rails blurred, like frosted glass, under widgets.opacity's tint.
frost = false

# How thick widgets' outlines are, in dp. 0 draws none, but the focused one's.
border-width = 2

# The outline of widgets, the prompt bar and the rails: "theme" is the theme's border color.
border = "theme"

# The outline of the widget in use or being arranged: "theme" is the theme's accent.
border-focused = "theme"

[screens]
# Space in dp from full-screen panels (settings, style, the stores) to the screen's edges.
gaps-out = 6

# How thick full-screen panels' outlines are, in dp.
border-width = 2

[keybar]
# Space in dp from the terminal key bar's frame to the screen's sides and the keyboard.
gaps-out = 6

# How thick the terminal key bar's frame is, in dp. 0 draws none.
border-width = 2

[icons]
# App icons as silhouettes in the accent color, as on Omarchy, rather than in their own colors.
monochrome = false

[corners]
# Multiplies every frame's corner radius: 0 square (Omarchy), 0.5 soft, 1 round like stock Android.
scale = 0

[status-bar]
# Android's status bar on home; false hides it until a swipe down from the top edge.
shown = true

# Android's status bar at the top of home on a band of the tiles' glass; false leaves the bare wallpaper.
framed = false

# The band's color: "theme" is the theme's background, like the tiles.
background = "theme"

# How much the band covers the wallpaper: 0.88 like the tiles by default (widgets.opacity), 1 solid.
opacity = 0.88

# The line on the band's side facing the widgets: "theme" follows widgets.border.
border = "theme"

# How thick that line is, in dp; 0 draws none.
border-width = 2

[navigation-bar]
# Android's gesture or button bar on home on a band of the tiles' glass; false leaves the bare wallpaper.
framed = false

# The band's color: "theme" is the theme's background, like the tiles.
background = "theme"

# How much the band covers the wallpaper: 0.88 like the tiles by default (widgets.opacity), 1 solid.
opacity = 0.88

# The line on the band's side facing the widgets: "theme" follows widgets.border.
border = "theme"

# How thick that line is, in dp; 0 draws none.
border-width = 2

[terminal]
# The terminals' font family; fc-list :spacing=100 lists those installed.
font = "JetBrains Mono"

# The terminals' em size in dp, before Android's font size: 10 smaller, 12 default, 14 larger.
text = 12

[gestures]
# The app drawer, which swiping up opens: a panel's file name in ~/.config/omalauncher/widgets, by default drawer.owl; "none" leaves only tapping the bar to open drawer.owl. One that's gone or doesn't compile falls back to drawer.owl, then to .stock-drawer.owl, the drawer as it ships.
swipe-up = "drawer.owl"

# What swiping down on home opens: "none" nothing, or a panel's file name in ~/.config/omalauncher/widgets ("my-panel.owl"); one that's gone or doesn't compile opens nothing.
swipe-down = "none"
